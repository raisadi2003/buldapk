name: Build ICE Admin and User v26

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Periksa source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ADMIN_ZIP="ice_v2891_admin_v26_https_toggle.zip"
          USER_ZIP="ice_v2891_user_v26_https_toggle.zip"

          [[ -f "$ADMIN_ZIP" ]] || {
            echo "Source Admin tidak ditemukan: $ADMIN_ZIP"
            exit 1
          }

          [[ -f "$USER_ZIP" ]] || {
            echo "Source User tidak ditemukan: $USER_ZIP"
            exit 1
          }

      - name: Extract source Admin dan User
        shell: bash
        run: |
          set -euo pipefail

          rm -rf src-admin src-user out
          mkdir -p src-admin src-user out/admin out/user

          unzip -q ice_v2891_admin_v26_https_toggle.zip -d src-admin
          unzip -q ice_v2891_user_v26_https_toggle.zip -d src-user

          ADMIN_SETTINGS=$(find src-admin \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          USER_SETTINGS=$(find src-user \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)

          [[ -n "$ADMIN_SETTINGS" ]] || {
            echo "settings.gradle Admin tidak ditemukan"
            exit 1
          }

          [[ -n "$USER_SETTINGS" ]] || {
            echo "settings.gradle User tidak ditemukan"
            exit 1
          }

          ADMIN_DIR=$(dirname "$ADMIN_SETTINGS")
          USER_DIR=$(dirname "$USER_SETTINGS")

          echo "ADMIN_DIR=$ADMIN_DIR" >> "$GITHUB_ENV"
          echo "USER_DIR=$USER_DIR" >> "$GITHUB_ENV"

      - name: Build dan sign APK Admin
        shell: bash
        run: |
          set -euo pipefail

          cd "$ADMIN_DIR"

          [[ -f build_admin.sh ]] || {
            echo "build_admin.sh tidak ditemukan"
            exit 1
          }

          chmod +x build_admin.sh
          ./build_admin.sh

          ADMIN_APK=$(find . -maxdepth 1 -type f -name 'ice_v*_admin.apk' | sort -V | tail -n 1)

          [[ -n "$ADMIN_APK" ]] || {
            echo "APK Admin tidak ditemukan"
            exit 1
          }

          cp "$ADMIN_APK" "$GITHUB_WORKSPACE/out/admin/ICE_Admin_v26.apk"

      - name: Build dan sign APK User
        shell: bash
        run: |
          set -euo pipefail

          cd "$USER_DIR"

          [[ -f build_user.sh ]] || {
            echo "build_user.sh tidak ditemukan"
            exit 1
          }

          chmod +x build_user.sh
          ./build_user.sh

          USER_APK=$(find . -maxdepth 1 -type f -name 'ice_v*_user.apk' | sort -V | tail -n 1)

          [[ -n "$USER_APK" ]] || {
            echo "APK User tidak ditemukan"
            exit 1
          }

          cp "$USER_APK" "$GITHUB_WORKSPACE/out/user/ICE_User_v26.apk"

      - name: Upload APK Admin
        uses: actions/upload-artifact@v4
        with:
          name: ICE-Admin-v26
          path: out/admin/ICE_Admin_v26.apk
          if-no-files-found: error

      - name: Upload APK User
        uses: actions/upload-artifact@v4
        with:
          name: ICE-User-v26
          path: out/user/ICE_User_v26.apk
          if-no-files-found: error

      - name: Upload kedua APK
        uses: actions/upload-artifact@v4
        with:
          name: ICE-Admin-dan-User-v26
          path: out
          if-no-files-found: error
