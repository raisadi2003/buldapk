name: Build ICE Admin and User

on:
  workflow_dispatch:
  push:
    paths:
      - "ice_v2891_admin_v26_https_toggle.zip"
      - "ice_v2891_user_v26_https_toggle.zip"
      - ".github/workflows/build_ice_admin_user_v26.yml"

jobs:
  build-admin-user:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Admin
        shell: bash
        run: |
          set -e
          rm -rf build-admin
          mkdir build-admin
          unzip -q ice_v2891_admin_v26_https_toggle.zip -d build-admin

          ADMIN_ROOT="$(find build-admin -type f -name gradlew -printf '%h\n' | head -n 1)"
          if [ -z "$ADMIN_ROOT" ]; then
            echo "gradlew tidak ditemukan di ZIP Admin"
            exit 1
          fi

          cd "$ADMIN_ROOT"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Collect Admin APK
        shell: bash
        run: |
          set -e
          mkdir -p output/admin
          find build-admin -type f -path "*/build/outputs/apk/debug/*.apk" -exec cp {} output/admin/ICE_Admin_v26.apk \;
          test -f output/admin/ICE_Admin_v26.apk

      - name: Build User
        shell: bash
        run: |
          set -e
          rm -rf build-user
          mkdir build-user
          unzip -q ice_v2891_user_v26_https_toggle.zip -d build-user

          USER_ROOT="$(find build-user -type f -name gradlew -printf '%h\n' | head -n 1)"
          if [ -z "$USER_ROOT" ]; then
            echo "gradlew tidak ditemukan di ZIP User"
            exit 1
          fi

          cd "$USER_ROOT"
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Collect User APK
        shell: bash
        run: |
          set -e
          mkdir -p output/user
          find build-user -type f -path "*/build/outputs/apk/debug/*.apk" -exec cp {} output/user/ICE_User_v26.apk \;
          test -f output/user/ICE_User_v26.apk

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: ICE-Admin-v26
          path: output/admin/ICE_Admin_v26.apk
          if-no-files-found: error

      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: ICE-User-v26
          path: output/user/ICE_User_v26.apk
          if-no-files-found: error

      - name: Upload Both APKs
        uses: actions/upload-artifact@v4
        with:
          name: ICE-Admin-and-User-v26
          path: output
          if-no-files-found: error
