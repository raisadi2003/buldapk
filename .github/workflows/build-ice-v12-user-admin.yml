name: Build ICE v12 User dan Admin

on:
  workflow_dispatch:

jobs:
  build-user:
    name: Build ICE User v12
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract source User v12
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ice_v2891_user_v12_find_page_ICE_bubble.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::File $ZIP tidak ditemukan di halaman utama repository."
            exit 1
          fi

          rm -rf user-source
          mkdir -p user-source
          unzip -q "$ZIP" -d user-source

      - name: Build dan sign APK User
        shell: bash
        run: |
          set -euo pipefail
          cd user-source
          chmod +x build_user.sh
          ./build_user.sh

          test -f ice_v2891_user.apk
          mkdir -p "$GITHUB_WORKSPACE/output-user"
          cp ice_v2891_user.apk "$GITHUB_WORKSPACE/output-user/ICE-v12-User.apk"

      - name: Upload APK User
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v12-User-APK
          path: output-user/ICE-v12-User.apk
          if-no-files-found: error
          retention-days: 30

  build-admin:
    name: Build ICE 404 Admin v12
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract source Admin v12
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ice_v2891_admin_v12_find_page_ICE404_bubble.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::File $ZIP tidak ditemukan di halaman utama repository."
            exit 1
          fi

          rm -rf admin-source
          mkdir -p admin-source
          unzip -q "$ZIP" -d admin-source

      - name: Build dan sign APK Admin
        shell: bash
        run: |
          set -euo pipefail
          cd admin-source
          chmod +x build_admin.sh
          ./build_admin.sh

          test -f ice_v2891_admin.apk
          mkdir -p "$GITHUB_WORKSPACE/output-admin"
          cp ice_v2891_admin.apk "$GITHUB_WORKSPACE/output-admin/ICE404-v12-Admin.apk"

      - name: Upload APK Admin
        uses: actions/upload-artifact@v4
        with:
          name: ICE404-v12-Admin-APK
          path: output-admin/ICE404-v12-Admin.apk
          if-no-files-found: error
          retention-days: 30
