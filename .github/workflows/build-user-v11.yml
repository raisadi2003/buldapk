name: Build ICE User v11 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source ZIP User
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*user*.zip' | sort -V | tail -n 1)
          test -n "$ZIP_FILE" || { echo "ZIP source User tidak ditemukan di root repository"; exit 1; }
          echo "Memakai $ZIP_FILE"
          rm -rf src
          mkdir -p src
          unzip -q "$ZIP_FILE" -d src
          PROJECT_FILE=$(find src \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          test -n "$PROJECT_FILE" || { echo "settings.gradle tidak ditemukan"; exit 1; }
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build dan sign APK User
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x build_user.sh
          ./build_user.sh
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK_FILE=$(find . -maxdepth 1 -type f -iname '*user*.apk' | sort -V | tail -n 1)
          test -n "$APK_FILE" || { echo "APK User tidak ditemukan"; exit 1; }
          APK_NAME=$(basename "$APK_FILE")
          cp "$APK_FILE" "$GITHUB_WORKSPACE/out/$APK_NAME"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK User
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: out/${{ env.APK_NAME }}
          if-no-files-found: error
