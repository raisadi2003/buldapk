name: Build ICE v26.5 Gecko User Admin
on:
  workflow_dispatch:
  push:
    paths:
      - 'ice_v26_5_gecko_user_source_fixed.zip'
      - 'ice_v26_5_gecko_admin_source_fixed.zip'
      - '.github/workflows/build-ice-v26-5-gecko-user-admin-fixed.yml'

jobs:
  build-user:
    name: Build User Gecko
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract dan validasi User Gecko
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-user && mkdir build-user
          unzip -q ice_v26_5_gecko_user_source_fixed.zip -d build-user
          test -f build-user/app/build.gradle
          grep -Eq 'minSdk[[:space:]]+26' build-user/app/build.gradle
      - name: Build User Gecko
        shell: bash
        run: |
          set -o pipefail
          cd build-user
          gradle --no-daemon clean assembleRelease --stacktrace 2>&1 | tee ../user-build.log
      - name: Upload User APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v26.5-Gecko-User
          path: build-user/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload User build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v26.5-User-build-log
          path: user-build.log
          if-no-files-found: ignore

  build-admin:
    name: Build Admin Gecko
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract dan validasi Admin Gecko
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-admin && mkdir build-admin
          unzip -q ice_v26_5_gecko_admin_source_fixed.zip -d build-admin
          test -f build-admin/app/build.gradle
          grep -Eq 'minSdk[[:space:]]+26' build-admin/app/build.gradle
      - name: Build Admin Gecko
        shell: bash
        run: |
          set -o pipefail
          cd build-admin
          gradle --no-daemon clean assembleRelease --stacktrace 2>&1 | tee ../admin-build.log
      - name: Upload Admin APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ICE-404-v26.5-Gecko-Admin
          path: build-admin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload Admin build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v26.5-Admin-build-log
          path: admin-build.log
          if-no-files-found: ignore
