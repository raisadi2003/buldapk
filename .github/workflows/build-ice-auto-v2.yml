name: Build ICE User + Admin Otomatis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cari ZIP User dan Admin otomatis
        shell: bash
        run: |
          set -euo pipefail

          echo "Daftar file ZIP yang ditemukan:"
          find . -type f -iname '*.zip' -not -path './.git/*' -print || true

          USER_ZIP="$(find . -type f -iname '*user*.zip' -not -path './.git/*' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
          ADMIN_ZIP="$(find . -type f -iname '*admin*.zip' -not -path './.git/*' -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"

          if [[ -z "$USER_ZIP" ]]; then
            echo "ERROR: ZIP User tidak ditemukan. Pastikan nama file mengandung kata user."
            exit 1
          fi

          if [[ -z "$ADMIN_ZIP" ]]; then
            echo "ERROR: ZIP Admin tidak ditemukan. Pastikan nama file mengandung kata admin."
            exit 1
          fi

          echo "USER_ZIP=$USER_ZIP" >> "$GITHUB_ENV"
          echo "ADMIN_ZIP=$ADMIN_ZIP" >> "$GITHUB_ENV"
          echo "ZIP User : $USER_ZIP"
          echo "ZIP Admin: $ADMIN_ZIP"

      - name: Extract source User
        shell: bash
        run: |
          set -euo pipefail
          rm -rf user_src
          mkdir -p user_src
          unzip -q "$USER_ZIP" -d user_src

          USER_PROJECT_FILE="$(find user_src -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          [[ -n "$USER_PROJECT_FILE" ]] || { echo "settings.gradle User tidak ditemukan"; exit 1; }

          USER_PROJECT_DIR="$(dirname "$USER_PROJECT_FILE")"
          echo "USER_PROJECT_DIR=$USER_PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project User: $USER_PROJECT_DIR"

      - name: Build dan sign APK User
        shell: bash
        run: |
          set -euo pipefail
          cd "$USER_PROJECT_DIR"
          [[ -f build_user.sh ]] || { echo "build_user.sh tidak ditemukan"; exit 1; }
          chmod +x build_user.sh
          ./build_user.sh

          USER_APK="$(find . -type f -iname '*user*.apk' | sort -V | tail -n 1)"
          [[ -n "$USER_APK" ]] || { echo "APK User tidak ditemukan setelah build"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/out/user"
          cp "$USER_APK" "$GITHUB_WORKSPACE/out/user/ICE-User.apk"

      - name: Extract source Admin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf admin_src
          mkdir -p admin_src
          unzip -q "$ADMIN_ZIP" -d admin_src

          ADMIN_PROJECT_FILE="$(find admin_src -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
          [[ -n "$ADMIN_PROJECT_FILE" ]] || { echo "settings.gradle Admin tidak ditemukan"; exit 1; }

          ADMIN_PROJECT_DIR="$(dirname "$ADMIN_PROJECT_FILE")"
          echo "ADMIN_PROJECT_DIR=$ADMIN_PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project Admin: $ADMIN_PROJECT_DIR"

      - name: Build dan sign APK Admin
        shell: bash
        run: |
          set -euo pipefail
          cd "$ADMIN_PROJECT_DIR"
          [[ -f build_admin.sh ]] || { echo "build_admin.sh tidak ditemukan"; exit 1; }
          chmod +x build_admin.sh
          ./build_admin.sh

          ADMIN_APK="$(find . -type f -iname '*admin*.apk' | sort -V | tail -n 1)"
          [[ -n "$ADMIN_APK" ]] || { echo "APK Admin tidak ditemukan setelah build"; exit 1; }

          mkdir -p "$GITHUB_WORKSPACE/out/admin"
          cp "$ADMIN_APK" "$GITHUB_WORKSPACE/out/admin/ICE-404-Admin.apk"

      - name: Upload APK User
        uses: actions/upload-artifact@v4
        with:
          name: ICE-User-APK
          path: out/user/ICE-User.apk
          if-no-files-found: error

      - name: Upload APK Admin
        uses: actions/upload-artifact@v4
        with:
          name: ICE-404-Admin-APK
          path: out/admin/ICE-404-Admin.apk
          if-no-files-found: error
