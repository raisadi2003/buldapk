name: Build ICE Camera CM5 from ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "*.zip"
      - ".github/workflows/build-ice-camera-cm5-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'ICE_Camera_CM5*.zip' | head -n 1)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "Source ZIP tidak ditemukan di root repository."
            echo "Upload file ICE_Camera_CM5_v1_source.zip tanpa diekstrak."
            exit 1
          fi

          rm -rf extracted_source
          mkdir -p extracted_source
          unzip -q "${ZIP_FILE}" -d extracted_source

          PROJECT_DIR="$(find extracted_source -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -printf '%h\n' | head -n 1)"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "settings.gradle/settings.gradle.kts tidak ditemukan di dalam ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Project ditemukan di: ${PROJECT_DIR}"

      - name: Build debug and release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect APK files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk-output
          find "${PROJECT_DIR}/app/build/outputs/apk" -type f -name '*.apk' -exec cp {} apk-output/ \;
          ls -lh apk-output

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ICE-Camera-CM5-APK
          path: apk-output/*.apk
          if-no-files-found: error
