name: Build ICE v21 User dan Admin

on:
  workflow_dispatch:

jobs:
  build-user:
    name: Build ICE User v21
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Extract source User v21
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ice_v2891_user_v21_touch_feedback.zip"
          test -f "$ZIP" || { echo "::error::File $ZIP tidak ditemukan di root repository."; exit 1; }
          rm -rf user-source
          mkdir -p user-source
          unzip -q "$ZIP" -d user-source
          test -f user-source/build_user.sh || { echo "::error::build_user.sh tidak ditemukan."; exit 1; }
      - name: Build dan sign APK User
        shell: bash
        run: |
          set -euo pipefail
          cd user-source
          chmod +x build_user.sh
          ./build_user.sh
          test -f ice_v2891_user.apk
          mkdir -p "$GITHUB_WORKSPACE/output-user"
          cp ice_v2891_user.apk "$GITHUB_WORKSPACE/output-user/ICE-v21-User.apk"
      - name: Upload APK User
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v21-User-APK
          path: output-user/ICE-v21-User.apk
          if-no-files-found: error
          retention-days: 30

  build-admin:
    name: Build ICE 404 Admin v21
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Extract source Admin v21
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ice_v2891_admin_v21_touch_feedback.zip"
          test -f "$ZIP" || { echo "::error::File $ZIP tidak ditemukan di root repository."; exit 1; }
          rm -rf admin-source
          mkdir -p admin-source
          unzip -q "$ZIP" -d admin-source
          test -f admin-source/build_admin.sh || { echo "::error::build_admin.sh tidak ditemukan."; exit 1; }
      - name: Build dan sign APK Admin
        shell: bash
        run: |
          set -euo pipefail
          cd admin-source
          chmod +x build_admin.sh
          ./build_admin.sh
          test -f ice_v2891_admin.apk
          mkdir -p "$GITHUB_WORKSPACE/output-admin"
          cp ice_v2891_admin.apk "$GITHUB_WORKSPACE/output-admin/ICE404-v21-Admin.apk"
      - name: Upload APK Admin
        uses: actions/upload-artifact@v4
        with:
          name: ICE404-v21-Admin-APK
          path: output-admin/ICE404-v21-Admin.apk
          if-no-files-found: error
          retention-days: 30
