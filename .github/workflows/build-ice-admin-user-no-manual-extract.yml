name: Build ICE Admin + User

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: admin
            label: ICE Admin
            zip_pattern: 'ICE_Admin*.zip'
            build_script: build_admin.sh
            artifact_name: ICE-Admin-v1.1
          - variant: user
            label: ICE User
            zip_pattern: 'ICE_User*.zip'
            build_script: build_user.sh
            artifact_name: ICE-User-v1.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # User tidak perlu mengekstrak ZIP secara manual.
      # Workflow mengekstraknya hanya sementara di runner GitHub Actions.
      - name: Siapkan source ZIP otomatis
        shell: bash
        env:
          ZIP_PATTERN: ${{ matrix.zip_pattern }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname "$ZIP_PATTERN" -printf '%p\n' | sort -V | tail -n 1)"
          if [[ -z "${ZIP_FILE:-}" ]]; then
            echo "Source ZIP $VARIANT tidak ditemukan. Pola: $ZIP_PATTERN" >&2
            find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -name '*.zip' -print || true
            exit 1
          fi

          echo "Source: $ZIP_FILE"
          DEST="$RUNNER_TEMP/ice-$VARIANT"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"

          PROJECT_FILE="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print | head -n 1)"
          if [[ -z "${PROJECT_FILE:-}" ]]; then
            echo "settings.gradle/settings.gradle.kts tidak ditemukan di source ZIP." >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Build APK
        shell: bash
        env:
          BUILD_SCRIPT: ${{ matrix.build_script }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f "$BUILD_SCRIPT" ]]; then
            chmod +x "$BUILD_SCRIPT"
            "./$BUILD_SCRIPT"
          elif [[ -x ./gradlew || -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

          OUT="$GITHUB_WORKSPACE/out-$VARIANT"
          mkdir -p "$OUT"

          # Ambil APK release/sign hasil script terlebih dahulu; fallback ke APK Gradle.
          APK_FILE="$(find "$PROJECT_DIR" -type f -name '*.apk' \
            ! -path '*/intermediates/*' \
            ! -path '*/.gradle/*' \
            -print | sort -V | tail -n 1)"

          if [[ -z "${APK_FILE:-}" || ! -f "$APK_FILE" ]]; then
            echo "APK hasil build tidak ditemukan." >&2
            exit 1
          fi

          cp "$APK_FILE" "$OUT/ICE_${VARIANT}_v1.1.apk"
          echo "APK: $OUT/ICE_${VARIANT}_v1.1.apk"

      - name: Upload ${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out-${{ matrix.variant }}/*.apk
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Gabungkan APK Admin + User
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download kedua APK
        uses: actions/download-artifact@v4
        with:
          pattern: ICE-*-v1.1
          path: hasil-apk
          merge-multiple: true

      - name: Periksa hasil
        shell: bash
        run: |
          set -euo pipefail
          find hasil-apk -maxdepth 1 -type f -name '*.apk' -print
          COUNT="$(find hasil-apk -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [[ "$COUNT" -lt 2 ]]; then
            echo "Harus ada 2 APK, tetapi hanya ditemukan $COUNT." >&2
            exit 1
          fi

      - name: Upload Admin + User sekaligus
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v1.1-Admin-User-APKs
          path: hasil-apk/*.apk
          if-no-files-found: error
          retention-days: 30
