name: Build ICE Otomatis

on:
  workflow_dispatch:
  push:
    paths:
      - "**/*.zip"
      - ".github/workflows/build-ice-auto-v3.yml"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Cari semua source ZIP ICE
        id: scan
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' ZIPS < <(
            find . -type f -iname '*.zip' \
              ! -path './.git/*' \
              -print0 | sort -z
          )

          echo "Daftar ZIP yang ditemukan:"
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "(tidak ada)"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${ZIPS[@]}"

          JSON='[]'
          USER_FOUND=0
          ADMIN_FOUND=0

          for FILE in "${ZIPS[@]}"; do
            BASENAME="$(basename "$FILE")"
            LOWER="$(printf '%s' "$BASENAME" | tr '[:upper:]' '[:lower:]')"

            TYPE=""
            APP_NAME=""
            if [[ "$LOWER" == *admin* ]]; then
              TYPE="admin"
              APP_NAME="ICE-404-Admin"
              ADMIN_FOUND=1
            elif [[ "$LOWER" == *user* ]]; then
              TYPE="user"
              APP_NAME="ICE-User"
              USER_FOUND=1
            else
              continue
            fi

            JSON="$(jq -c \
              --arg type "$TYPE" \
              --arg zip "$FILE" \
              --arg name "$APP_NAME" \
              '. + [{"type":$type,"zip":$zip,"artifact":$name}]' \
              <<< "$JSON")"
          done

          COUNT="$(jq 'length' <<< "$JSON")"
          MATRIX="$(jq -c '{include:.}' <<< "$JSON")"

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$USER_FOUND" -eq 0 ]; then
            echo "::warning::ZIP User tidak ditemukan. Build User dilewati."
          fi
          if [ "$ADMIN_FOUND" -eq 0 ]; then
            echo "::warning::ZIP Admin tidak ditemukan. Build Admin dilewati."
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Tidak ada ZIP dengan nama mengandung 'user' atau 'admin'."
            exit 1
          fi

  build:
    needs: detect
    if: needs.detect.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    name: Build ${{ matrix.artifact }}

    steps:
      - name: Ambil repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract source ${{ matrix.type }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          mkdir -p source
          unzip -q "${{ matrix.zip }}" -d source

          # Jika ZIP berisi satu folder pembungkus, masuk ke folder tersebut.
          PROJECT_DIR="source"
          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            FOUND="$(find source -type f -name gradlew -print -quit || true)"
            if [ -n "$FOUND" ]; then
              PROJECT_DIR="$(dirname "$FOUND")"
            fi
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "::error::File gradlew tidak ditemukan di dalam ${{ matrix.zip }}"
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon clean assembleDebug

      - name: Kumpulkan APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t APKS < <(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/*/*.apk' | sort)

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::APK hasil build tidak ditemukan."
            exit 1
          fi

          i=1
          for APK in "${APKS[@]}"; do
            cp "$APK" "output/${{ matrix.artifact }}-${i}.apk"
            i=$((i + 1))
          done

          ls -lh output

      - name: Upload APK ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
