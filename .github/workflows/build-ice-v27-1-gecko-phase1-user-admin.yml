name: Build ICE v27.1 Gecko Phase 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'ice_v27_1_gecko_phase1_user_source.zip'
      - 'ice_v27_1_gecko_phase1_admin_source.zip'
      - '.github/workflows/build-ice-v27-1-gecko-phase1-user-admin.yml'

jobs:
  build-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract dan build User
        run: |
          set -euo pipefail
          rm -rf build-user && mkdir build-user
          unzip -q ice_v27_1_gecko_phase1_user_source.zip -d build-user
          cd build-user
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ICE-v27.1-GECKO-PHASE1-USER.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICE-v27.1-Gecko-Phase1-User
          path: |
            ICE-v27.1-GECKO-PHASE1-USER.apk
            build-user/app/build/reports/**
          if-no-files-found: warn

  build-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract dan build Admin
        run: |
          set -euo pipefail
          rm -rf build-admin && mkdir build-admin
          unzip -q ice_v27_1_gecko_phase1_admin_source.zip -d build-admin
          cd build-admin
          gradle :app:assembleDebug --stacktrace --no-daemon
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ICE-404-v27.1-GECKO-PHASE1-ADMIN.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ICE-404-v27.1-Gecko-Phase1-Admin
          path: |
            ICE-404-v27.1-GECKO-PHASE1-ADMIN.apk
            build-admin/app/build/reports/**
          if-no-files-found: warn
