name: Build ICE v26.6 Gecko Installable
on:
  workflow_dispatch:
  push:
    paths:
      - 'ice_v26_6_gecko_user_source_installable.zip'
      - 'ice_v26_6_gecko_admin_source_installable.zip'
      - '.github/workflows/build-ice-v26-6-gecko-user-admin-installable.yml'

jobs:
  build-user:
    name: Build User Gecko Installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract dan build User
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-user && mkdir build-user
          unzip -q ice_v26_6_gecko_user_source_installable.zip -d build-user
          cd build-user
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee ../user-build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ICE-v26.6-GECKO-USER-INSTALLABLE.apk
      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v26.6-Gecko-User-Installable
          path: ICE-v26.6-GECKO-USER-INSTALLABLE.apk
          if-no-files-found: error
      - name: Upload User log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v26.6-User-build-log
          path: user-build.log
          if-no-files-found: ignore

  build-admin:
    name: Build Admin Gecko Installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract dan build Admin
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-admin && mkdir build-admin
          unzip -q ice_v26_6_gecko_admin_source_installable.zip -d build-admin
          cd build-admin
          gradle --no-daemon clean assembleDebug --stacktrace 2>&1 | tee ../admin-build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../ICE-404-v26.6-GECKO-ADMIN-INSTALLABLE.apk
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: ICE-404-v26.6-Gecko-Admin-Installable
          path: ICE-404-v26.6-GECKO-ADMIN-INSTALLABLE.apk
          if-no-files-found: error
      - name: Upload Admin log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v26.6-Admin-build-log
          path: admin-build.log
          if-no-files-found: ignore
