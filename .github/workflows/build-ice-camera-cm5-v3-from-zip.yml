name: Build ICE Camera CM5 v3 from ZIP

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "ICE_Camera_CM5_v3_preview_fixed.zip"
      - ".github/workflows/build-ice-camera-cm5-v3-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -q ICE_Camera_CM5_v3_preview_fixed.zip -d extracted_source
          PROJECT_DIR="$(find extracted_source -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
      - name: Collect APK
        if: success()
        shell: bash
        run: |
          mkdir -p apk-output
          find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -exec cp {} apk-output/ICE-Camera-CM5-v3-debug.apk \;
          test -f apk-output/ICE-Camera-CM5-v3-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ICE-Camera-CM5-v3-APK
          path: apk-output/ICE-Camera-CM5-v3-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ICE-Camera-CM5-v3-build-log
          path: build-log.txt
          if-no-files-found: ignore
