name: Build Signed ICE Admin + User

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: admin
            label: ICE Admin
            source_zip: ICE_Admin_v1.1_clear_fixed.zip
            output_apk: ICE_admin_v1.1.apk
            artifact_name: ICE-Admin-v1.1-Signed
          - variant: user
            label: ICE User
            source_zip: ICE_User_v1.1_clear_fixed.zip
            output_apk: ICE_user_v1.1.apk
            artifact_name: ICE-User-v1.1-Signed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore dari GitHub Secret
        shell: bash
        env:
          ICE_KEYSTORE_BASE64: ${{ secrets.ICE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ICE_KEYSTORE_BASE64:-}" ]]; then
            echo "ERROR: GitHub Secret ICE_KEYSTORE_BASE64 belum dibuat." >&2
            exit 1
          fi
          printf '%s' "$ICE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ice-release.jks"
          test -s "$RUNNER_TEMP/ice-release.jks"

      - name: Ekstrak source ZIP otomatis
        shell: bash
        env:
          SOURCE_ZIP: ${{ matrix.source_zip }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/$SOURCE_ZIP"

          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: $SOURCE_ZIP tidak ditemukan di root repository." >&2
            exit 1
          fi

          DEST="$RUNNER_TEMP/source-$VARIANT"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"

          PROJECT_FILE="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "${PROJECT_FILE:-}" ]]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan." >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

          UNSIGNED_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)"
          if [[ -z "${UNSIGNED_APK:-}" || ! -f "$UNSIGNED_APK" ]]; then
            echo "ERROR: APK release tidak ditemukan." >&2
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi
          echo "UNSIGNED_APK=$UNSIGNED_APK" >> "$GITHUB_ENV"

      - name: Cari zipalign dan apksigner
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          if [[ -z "${BUILD_TOOLS:-}" ]]; then
            echo "ERROR: Android build-tools tidak ditemukan." >&2
            exit 1
          fi

          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          test -x "$ZIPALIGN"
          test -x "$APKSIGNER"

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

      - name: Zipalign dan sign APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ICE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ICE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ICE_KEY_PASSWORD }}
          VARIANT: ${{ matrix.variant }}
          OUTPUT_APK: ${{ matrix.output_apk }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "ERROR: Secret keystore belum lengkap." >&2
            echo "Wajib: ICE_KEYSTORE_PASSWORD, ICE_KEY_ALIAS, ICE_KEY_PASSWORD" >&2
            exit 1
          fi

          OUT_DIR="$GITHUB_WORKSPACE/out-$VARIANT"
          mkdir -p "$OUT_DIR"

          ALIGNED_APK="$RUNNER_TEMP/${VARIANT}-aligned.apk"
          SIGNED_APK="$OUT_DIR/$OUTPUT_APK"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/ice-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED_APK"

      - name: Upload ${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out-${{ matrix.variant }}/*.apk
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Gabungkan signed APK
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Admin + User
        uses: actions/download-artifact@v4
        with:
          pattern: ICE-*-v1.1-Signed
          path: hasil-apk
          merge-multiple: true

      - name: Cek hasil
        shell: bash
        run: |
          set -euo pipefail
          ls -lah hasil-apk
          test -f hasil-apk/ICE_admin_v1.1.apk
          test -f hasil-apk/ICE_user_v1.1.apk

      - name: Upload paket gabungan
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v1.1-Admin-User-Signed
          path: hasil-apk/*.apk
          if-no-files-found: error
          retention-days: 30
