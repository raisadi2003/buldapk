name: Build ICE Admin + User

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: admin
            label: ICE Admin
            source_zip: ICE_Admin_v1.1_clear_fixed.zip
            artifact_name: ICE-Admin-v1.1
          - variant: user
            label: ICE User
            source_zip: ICE_User_v1.1_clear_fixed.zip
            artifact_name: ICE-User-v1.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ekstrak source otomatis
        shell: bash
        env:
          SOURCE_ZIP: ${{ matrix.source_zip }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/$SOURCE_ZIP"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "ERROR: $SOURCE_ZIP tidak ditemukan di root repository." >&2
            echo "File ZIP yang tersedia:"
            find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' -printf ' - %f\n' || true
            exit 1
          fi

          DEST="$RUNNER_TEMP/ice-$VARIANT"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP_FILE" -d "$DEST"

          PROJECT_FILE="$(find "$DEST" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "${PROJECT_FILE:-}" ]]; then
            echo "ERROR: settings.gradle/settings.gradle.kts tidak ditemukan." >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Build APK
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          # Source ini bisa dibuild dengan Gradle Wrapper bila ada,
          # atau Gradle 8.7 dari runner bila wrapper tidak tersedia.
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleRelease
          else
            gradle --no-daemon clean assembleRelease
          fi

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)"
          if [[ -z "${APK_FILE:-}" || ! -f "$APK_FILE" ]]; then
            echo "ERROR: APK release tidak ditemukan." >&2
            find "$PROJECT_DIR/app/build/outputs" -type f -print || true
            exit 1
          fi

          OUT="$GITHUB_WORKSPACE/out-$VARIANT"
          mkdir -p "$OUT"
          cp "$APK_FILE" "$OUT/ICE_${VARIANT}_v1.1.apk"

      - name: Upload ${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: out-${{ matrix.variant }}/*.apk
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Gabungkan APK Admin + User
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download kedua APK
        uses: actions/download-artifact@v4
        with:
          pattern: ICE-*-v1.1
          path: hasil-apk
          merge-multiple: true

      - name: Pastikan dua APK tersedia
        shell: bash
        run: |
          set -euo pipefail
          ls -lah hasil-apk
          test -f hasil-apk/ICE_admin_v1.1.apk
          test -f hasil-apk/ICE_user_v1.1.apk

      - name: Upload Admin + User sekaligus
        uses: actions/upload-artifact@v4
        with:
          name: ICE-v1.1-Admin-User-APKs
          path: hasil-apk/*.apk
          if-no-files-found: error
          retention-days: 30
